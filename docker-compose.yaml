version: "3.9"

services:

  ce1:
    image: vpp-frr:latest
    container_name: ce1
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/ce1.conf:/etc/frr/frr.conf:ro
    networks:
      ce1_pe1:
        ipv4_address: 100.64.1.20
      customer1_lan1:
        ipv4_address: 10.1.1.1

  ce3:
    image: vpp-frr:latest
    container_name: ce3
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/ce3.conf:/etc/frr/frr.conf:ro
    networks:
      ce3_pe1:
        ipv4_address: 100.64.6.20

  ce5:
    image: vpp-frr:latest
    container_name: ce5
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/ce5.conf:/etc/frr/frr.conf:ro
    networks:
      ce5_pe1:
        ipv4_address: 100.64.8.20

  pe1:
    image: vpp-frr:latest
    container_name: pe1
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/pe1.conf:/etc/frr/frr.conf:ro
    networks:
      ce1_pe1:
        ipv4_address: 100.64.1.10
      pe1_lsr1:
        ipv4_address: 100.64.2.10
      ce3_pe1:
        ipv4_address: 100.64.6.10
      ce5_pe1:
        ipv4_address: 100.64.8.10
      pe_mgmt:
        ipv4_address: 10.255.0.1

  lsr1:
    image: vpp-frr:latest
    container_name: lsr1
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/lsr1.conf:/etc/frr/frr.conf:ro
    networks:
      pe1_lsr1:
        ipv4_address: 100.64.2.20
      lsr1_lsr2:
        ipv4_address: 100.64.3.10

  lsr2:
    image: vpp-frr:latest
    container_name: lsr2
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/lsr2.conf:/etc/frr/frr.conf:ro
    networks:
      lsr1_lsr2:
        ipv4_address: 100.64.3.20
      lsr2_pe2:
        ipv4_address: 100.64.4.10
      gre_transport:
        ipv4_address: 203.0.113.1

  pe2:
    image: vpp-frr:latest
    container_name: pe2
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/pe2.conf:/etc/frr/frr.conf:ro
    networks:
      lsr2_pe2:
        ipv4_address: 100.64.4.20
      pe2_ce2:
        ipv4_address: 100.64.5.10
      pe2_ce4:
        ipv4_address: 100.64.7.10
      pe2_ce6:
        ipv4_address: 100.64.9.10
      pe_mgmt:
        ipv4_address: 10.255.0.2

  ce2:
    image: vpp-frr:latest
    container_name: ce2
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/ce2.conf:/etc/frr/frr.conf:ro
    networks:
      pe2_ce2:
        ipv4_address: 100.64.5.20
      customer1_lan2:
        ipv4_address: 10.1.2.1

  ce4:
    image: vpp-frr:latest
    container_name: ce4
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/ce4.conf:/etc/frr/frr.conf:ro
    networks:
      pe2_ce4:
        ipv4_address: 100.64.7.20

  ce6:
    image: vpp-frr:latest
    container_name: ce6
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/ce6.conf:/etc/frr/frr.conf:ro
    networks:
      pe2_ce6:
        ipv4_address: 100.64.9.20

  host1:
    image: ubuntu:22.04
    container_name: host1
    command: sleep infinity
    cap_add:
      - NET_ADMIN
    networks:
      customer1_lan1:
        ipv4_address: 10.1.1.10

  host2:
    image: ubuntu:22.04
    container_name: host2
    command: sleep infinity
    cap_add:
      - NET_ADMIN
    networks:
      customer1_lan2:
        ipv4_address: 10.1.2.10

  # --- Security PE (Remote PE over GRE tunnel) ---
  pe-sec:
    image: vpp-frr:latest
    container_name: pe-sec
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/pe-sec.conf:/etc/frr/frr.conf:ro
    networks:
      gre_transport:
        ipv4_address: 203.0.113.2
      sec_lan:
        ipv4_address: 100.64.100.1
      pe_mgmt:
        ipv4_address: 10.255.0.3

  fw:
    image: vpp-frr:latest
    container_name: fw
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./frr-configs/fw.conf:/etc/frr/frr.conf:ro
    networks:
      sec_lan:
        ipv4_address: 100.64.100.20
      sec_host_lan:
        ipv4_address: 10.100.1.1

  sec-host:
    image: ubuntu:22.04
    container_name: sec-host
    command: sleep infinity
    cap_add:
      - NET_ADMIN
    networks:
      sec_host_lan:
        ipv4_address: 10.100.1.10

networks:
  ce1_pe1:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.1.0/24

  pe1_lsr1:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.2.0/24

  lsr1_lsr2:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.3.0/24

  lsr2_pe2:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.4.0/24

  pe2_ce2:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.5.0/24

  ce3_pe1:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.6.0/24

  pe2_ce4:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.7.0/24

  ce5_pe1:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.8.0/24

  pe2_ce6:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.9.0/24

  customer1_lan1:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.1.0/24
          gateway: 10.1.1.254

  customer1_lan2:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.2.0/24
          gateway: 10.1.2.254

  pe_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.255.0.0/24
          gateway: 10.255.0.254

  gre_transport:
    driver: bridge
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.254

  sec_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.100.0/24
          gateway: 100.64.100.254

  sec_host_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.1.0/24
          gateway: 10.100.1.254
