!
! PE-SEC — Security Provider Edge (Remote PE via MPLS-over-GRE)
!
! Connects to MPLS core via GRE tunnel to LSR2
! Has VRF 10 for security device (FW) connectivity
! MP-iBGP with PE1/PE2 for VPNv4 route exchange
!
frr version 10.5.1
frr defaults traditional
hostname pe-sec
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! --- Global MP-iBGP (VPNv4) ---
router bgp 65000
 bgp router-id 10.255.0.3
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source 10.255.0.3
 neighbor 10.255.0.1 description PE1
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source 10.255.0.3
 neighbor 10.255.0.2 description PE2
 !
 address-family ipv4 vpn
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
 exit-address-family
!
! --- VRF 10: Security Zone ---
router bgp 65000 vrf VRF10
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:10
  rt vpn both 65000:10
  export vpn
  import vpn
  neighbor 100.64.100.20 remote-as 65010
  neighbor 100.64.100.20 description FW-Security-Device
  neighbor 100.64.100.20 route-map ACCEPT-ALL in
  neighbor 100.64.100.20 route-map ACCEPT-ALL out
 exit-address-family
!
route-map ACCEPT-ALL permit 10
!
end
