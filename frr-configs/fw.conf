!
! FW — Security Device (CE router behind PE-SEC)
!
! Acts as a simple security gateway / firewall CE
! eBGP with PE-SEC (ASN 65010)
! Advertises sec-host LAN (10.100.1.0/24) and PE-SEC link (100.64.100.0/24)
!
frr version 10.5.1
frr defaults traditional
hostname fw
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65010
 bgp router-id 100.64.100.20
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 10.100.1.0/24
  network 100.64.100.0/24
  redistribute connected
  neighbor 100.64.100.1 remote-as 65000
  neighbor 100.64.100.1 description PE-SEC
 exit-address-family
!
end
