!
! FW — Centralized Inline Security Device
!
! Acts as an inline firewall for ALL VRFs in the MPLS L3VPN network.
! Per-VRF eBGP peering with PE-SEC for route learning.
! Traffic flow: PE-SEC ingress VRF → FW (inspect) → PE-SEC egress VRF
!
! Each VRF has an ingress interface (receives from PE-SEC) and an egress
! interface (sends inspected traffic back). Default routes in each VRF
! send all traffic out the egress interface to PE-SEC's post-inspection VRF.
!
frr version 10.5.1
frr defaults traditional
hostname fw
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! VRF 10: Security inspection for customer 1 (CE1/CE2, host1/host2, sec-host)
router bgp 65010 vrf VRF10
 bgp router-id 100.64.100.20
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 10.100.1.0/24
  network 100.64.100.0/24
  network 100.64.101.0/24
  redistribute connected
  neighbor 100.64.100.1 remote-as 65000
  neighbor 100.64.100.1 description PE-SEC-VRF10
 exit-address-family
!
! VRF 20: Security inspection for customer 2 (CE3/CE4)
router bgp 65010 vrf VRF20
 bgp router-id 100.64.102.20
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 100.64.102.0/24
  network 100.64.103.0/24
  redistribute connected
  neighbor 100.64.102.1 remote-as 65000
  neighbor 100.64.102.1 description PE-SEC-VRF20
 exit-address-family
!
! VRF 30: Security inspection for customer 3 (CE5/CE6)
router bgp 65010 vrf VRF30
 bgp router-id 100.64.104.20
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 100.64.104.0/24
  network 100.64.105.0/24
  redistribute connected
  neighbor 100.64.104.1 remote-as 65000
  neighbor 100.64.104.1 description PE-SEC-VRF30
 exit-address-family
!
end
