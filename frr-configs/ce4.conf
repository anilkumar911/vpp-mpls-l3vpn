! CE4 FRR Configuration
! Role: Customer Edge for VRF 20 (PE2 side)
! eBGP ASN 65002, peers with PE2 (ASN 65000)
frr version 8.5
frr defaults traditional
hostname ce4
log syslog informational
!
router bgp 65002
 bgp router-id 100.64.7.20
 no bgp ebgp-requires-policy
 !
 neighbor 100.64.7.10 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 100.64.7.10 activate
  network 100.64.7.0/24
  network 10.2.2.0/24
  redistribute connected
 exit-address-family
!
end
