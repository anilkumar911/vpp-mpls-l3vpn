! CE3 FRR Configuration
! Role: Customer Edge for VRF 20 (PE1 side)
! eBGP ASN 65002, peers with PE1 (ASN 65000)
frr version 8.5
frr defaults traditional
hostname ce3
log syslog informational
!
router bgp 65002
 bgp router-id 100.64.6.20
 no bgp ebgp-requires-policy
 !
 neighbor 100.64.6.10 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 100.64.6.10 activate
  network 100.64.6.0/24
 exit-address-family
!
end
