! PE2 FRR Configuration
! Role: Provider Edge router — MP-iBGP to PE1, eBGP to CE2/CE4/CE6
frr version 8.5
frr defaults traditional
hostname pe2
log syslog informational
!
! ═══════════════════════════════════════
! MP-iBGP to PE1 (VPNv4 address family)
! ═══════════════════════════════════════
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 !
 ! iBGP peer: PE1
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source 10.255.0.2
 ! iBGP peer: PE-SEC (Security PE via GRE)
 neighbor 10.255.0.3 remote-as 65000
 neighbor 10.255.0.3 update-source 10.255.0.2
 !
 address-family ipv4 vpn
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 send-community both
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.3 send-community both
 exit-address-family
!
! ═══════════════════════════════════════
! VRF 10: CE2 peering
! ═══════════════════════════════════════
router bgp 65000 vrf VRF10
 bgp router-id 10.255.0.2
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65000:10
  rt vpn both 65000:10
  export vpn
  import vpn
  label vpn export auto
 exit-address-family
 !
 neighbor 100.64.5.20 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 100.64.5.20 activate
  neighbor 100.64.5.20 route-map ACCEPT-ALL in
  neighbor 100.64.5.20 route-map ACCEPT-ALL out
 exit-address-family
!
! ═══════════════════════════════════════
! VRF 20: CE4 peering
! ═══════════════════════════════════════
router bgp 65000 vrf VRF20
 bgp router-id 10.255.0.2
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65000:20
  rt vpn both 65000:20
  export vpn
  import vpn
  label vpn export auto
 exit-address-family
 !
 neighbor 100.64.7.20 remote-as 65002
 !
 address-family ipv4 unicast
  neighbor 100.64.7.20 activate
  neighbor 100.64.7.20 route-map ACCEPT-ALL in
  neighbor 100.64.7.20 route-map ACCEPT-ALL out
 exit-address-family
!
! ═══════════════════════════════════════
! VRF 30: CE6 peering (overlapping IPs with VRF 20)
! ═══════════════════════════════════════
router bgp 65000 vrf VRF30
 bgp router-id 10.255.0.2
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65000:30
  rt vpn both 65000:30
  export vpn
  import vpn
  label vpn export auto
 exit-address-family
 !
 neighbor 100.64.7.20 remote-as 65003
 !
 address-family ipv4 unicast
  neighbor 100.64.7.20 activate
  neighbor 100.64.7.20 route-map ACCEPT-ALL in
  neighbor 100.64.7.20 route-map ACCEPT-ALL out
 exit-address-family
!
route-map ACCEPT-ALL permit 10
!
end
