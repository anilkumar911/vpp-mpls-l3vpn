! PE1 FRR Configuration
! Role: Provider Edge router — MP-iBGP to PE2, eBGP to CE1/CE3/CE5
frr version 8.5
frr defaults traditional
hostname pe1
log syslog informational
!
! ═══════════════════════════════════════
! MP-iBGP to PE2 (VPNv4 address family)
! Uses loopback 10.255.0.1 as BGP router-id
! ═══════════════════════════════════════
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 !
 ! iBGP peer: PE2
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source 10.255.0.1
 !
 address-family ipv4 vpn
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 send-community both
 exit-address-family
!
! ═══════════════════════════════════════
! VRF 10: CE1 peering
! ═══════════════════════════════════════
router bgp 65000 vrf VRF10
 bgp router-id 10.255.0.1
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65000:10
  rt vpn both 65000:10
  export vpn
  import vpn
  label vpn export auto
 exit-address-family
 !
 neighbor 100.64.1.20 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 100.64.1.20 activate
  neighbor 100.64.1.20 route-map ACCEPT-ALL in
  neighbor 100.64.1.20 route-map ACCEPT-ALL out
 exit-address-family
!
! ═══════════════════════════════════════
! VRF 20: CE3 peering
! ═══════════════════════════════════════
router bgp 65000 vrf VRF20
 bgp router-id 10.255.0.1
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65000:20
  rt vpn both 65000:20
  export vpn
  import vpn
  label vpn export auto
 exit-address-family
 !
 neighbor 100.64.6.20 remote-as 65002
 !
 address-family ipv4 unicast
  neighbor 100.64.6.20 activate
  neighbor 100.64.6.20 route-map ACCEPT-ALL in
  neighbor 100.64.6.20 route-map ACCEPT-ALL out
 exit-address-family
!
! ═══════════════════════════════════════
! VRF 30: CE5 peering (overlapping IPs with VRF 20)
! Different RD/RT ensures separation
! ═══════════════════════════════════════
router bgp 65000 vrf VRF30
 bgp router-id 10.255.0.1
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65000:30
  rt vpn both 65000:30
  export vpn
  import vpn
  label vpn export auto
 exit-address-family
 !
 neighbor 100.64.6.20 remote-as 65003
 !
 address-family ipv4 unicast
  neighbor 100.64.6.20 activate
  neighbor 100.64.6.20 route-map ACCEPT-ALL in
  neighbor 100.64.6.20 route-map ACCEPT-ALL out
 exit-address-family
!
route-map ACCEPT-ALL permit 10
!
end
