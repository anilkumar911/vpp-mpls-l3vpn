! CE6 FRR Configuration
! Role: Customer Edge for VRF 30 (PE2 side)
! eBGP ASN 65003, peers with PE2 (ASN 65000)
! NOTE: Same IP as CE4 (100.64.7.20) — overlapping IP demo
frr version 8.5
frr defaults traditional
hostname ce6
log syslog informational
!
router bgp 65003
 bgp router-id 100.64.7.20
 no bgp ebgp-requires-policy
 !
 neighbor 100.64.7.10 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 100.64.7.10 activate
  network 100.64.7.0/24
 exit-address-family
!
end
